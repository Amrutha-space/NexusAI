apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: nexusai-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: nexusai/gateway-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: nexusai-config
            - secretRef:
                name: nexusai-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: nexusai-gateway
spec:
  selector:
    app: gateway-service
  ports:
    - port: 4000
      targetPort: 4000
---
