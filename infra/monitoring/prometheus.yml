global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway-service
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway-service:4000"]

  - job_name: auth-service
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:4001"]

  - job_name: rate-limiter-service
    metrics_path: /metrics
    static_configs:
      - targets: ["rate-limiter-service:4002"]

  - job_name: logging-service
    metrics_path: /metrics
    static_configs:
      - targets: ["logging-service:4003"]
